site_name: Practice Portfolio
site_url: https://sitename.example

nav: 
  - home: index.md
  - Tests: 
      - test1: Tests/test1.md
      - test2: Tests/test2.md
      - test3: Tests/test3.md
  - Material sample:
      - Nav & Theme: Material sample/Nav & Theme.md
      - Nav & Theme 2: Material sample/Nav & Theme 2.md
      - Preview control: Material sample/3. Preview Controls and Formatting Option.md
  - Resources:
      - Beauties: Resources/collages.md
      - Beauty test: Resources/collages2.md
  - idea deck:
      - Mirror Mirror: idea deck/Mirror Mirror.md
      - Mirror Mirror synthesized.md: idea deck/Mirror Mirror synthesized.md
      - Mirror Mirror full archive: idea deck/mirror_mirror_complete_conversation_archive.md
      - Mirror Mirror product blueprint.md: idea deck/mirror_mirror_core_architecture_product_blueprint.md

theme:
  name: material
  
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

  palette:
  # Dark Theme
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: dark mode
      primary: teal
      accent: red
      
   # Light Theme   
    - scheme: default
      primary: yellow
      accent: purple
      toggle: 
        icon: material/weather-night
        name: light mode

markdown_extensions:
  - pymdownx.superfences      # This enables flexibility of nesting especially within blocks
  - pymdownx.tabbed:
      alternate_style: true   # For content tabs
      slugify: !!python/object/apply:pymdownx.slugs.slugify 
        kwds:
          case: lower
  - admonition
  - footnotes
  - pymdownx.details          # This is a precursor to enabling superfences  
  - abbr                      # This enables defined abbreviations within the page to be defined by a tooltip 
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.emoji:           # This is to enable being able to add icons anywhere within your document
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nveesage

