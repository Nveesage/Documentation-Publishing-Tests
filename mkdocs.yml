site_name: new3
site_url: https://sitename.example

nav: 
  - home: index.md
  - Tests: 
      - test1: Tests/test1.md
      - test2: Tests/test2.md
      - test3: Tests/test3.md
  - Material for mkdocs sample: 
      - Nav & Theme: Material for mkdocs sample/Nav & Theme.md
      - Nav & Theme 2: Material for mkdocs sample/Nav & Theme 2.md
      - Preview control: Material for mkdocs sample/3. Preview Controls and Formatting Option.md

theme:
  name: material
  
  features:
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

  palette:
  # Dark Theme
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: dark mode
      primary: teal
      accent: red
      
   # Light Theme   
    - scheme: default
      primary: blue
      accent: light blue
      toggle: 
        icon: material/weather-night
        name: light mode

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details          # This is a precursor to enabling superfences  
  - abbr                      # This enables defined abbreviations within the page to be defined by a tooltip 
  - attr_list
  - md_in_html
  - pymdownx.superfences      # This enables flexibility of nesting especially within blocks
  - pymdownx.highlight
  - pymdownx.emoji:           # This is to enable being able to add icons anywhere within your document
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
